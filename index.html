let earth;

async function createRealGlobe() {
    const container = document.getElementById("globe");

    earth = Globe()(container)
        .backgroundColor("rgba(0,0,0,0)")
        .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
        .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
        .showAtmosphere(true)
        .atmosphereColor("#6ec6ff")
        .atmosphereAltitude(0.12)
        .polygonAltitude(0.002)
        .polygonCapColor(() => "rgba(255,255,255,0.03)")
        .polygonSideColor(() => "rgba(255,255,255,0.02)")
        .polygonStrokeColor(() => "rgba(255,255,255,0.8)")
        .polygonLabel(country => `<b>${country.properties.name}</b>`);
earth.width(380);
earth.height(380);

    earth.controls().enableDamping = true;
    earth.controls().dampingFactor = 0.08;

    const response = await fetch(
        "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json"
    );

    const world = await response.json();

    const countryFeatures = topojson.feature(
        world,
        world.objects.countries
    ).features;

    earth.polygonsData(countryFeatures);
}

createRealGlobe();
function spinGlobe() {

    const randomNumber = 
        Math.floor(Math.random() * countries.length);

    const country =
        countries[randomNumber];

    // Make the real Earth spin
    earth.controls().autoRotate = true;
    earth.controls().autoRotateSpeed = 8;

    setTimeout(function() {

        earth.controls().autoRotate = false;

        document.querySelector("#result").innerHTML = `

<img src="https://flagcdn.com/w320/${flagCodes[country.name]}.png"
     alt="${country.name} flag"
     style="width: 160px; border-radius: 8px;">

            <h2>🌎 ${country.name}</h2>

            <p>
                <strong>Capital:</strong>
                ${country.capital}
            </p>

            <p>
                <strong>Continent:</strong>
                ${country.continent}
            </p>

            <p>
                <strong>🤯 Cool Fact:</strong>
                ${country.fact}
            </p>

        `;

    }, 2000);

}
